name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moves to 26.04 from 2026-10-19, and the steps
    # below use the image's own Node.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version glimt is tested with; the mod API moves between releases.
      - run: npm install --global @anthropic-ai/claude-code@2.1.295
      - run: claude plugin validate --strict .
      - run: claude plugin test .
      # The type-check needs the engine's API types in .claude-plugin/types/.
      # Claude Code lays them beside a mod only in an interactive session, but
      # writes the same file for its plugin-authoring skill whenever that
      # loads, with no sign-in (the run itself stops at "Not logged in"). The
      # .gitignore is the engine's own, which keeps oxfmt off the file.
      - run: |
          claude -p /plugin-authoring || true
          mkdir -p .claude-plugin/types/claude-code
          cp "${TMPDIR:-/tmp}"/claude-"$(id -u)"/bundled-skills/*/*/plugin-authoring/types/claude-code.d.ts .claude-plugin/types/claude-code/index.d.ts
          echo '*' > .claude-plugin/types/.gitignore
      - run: npx --yes -p typescript@7.0.2 tsc -p . --noEmit
      - run: npx --yes oxfmt@0.72.0 --check
      # oxlint's type-aware rules run on typescript-go: bump oxlint-tsgolint
      # together with typescript above.
      - run: npx --yes -p oxlint@1.87.0 -p oxlint-tsgolint@7.0.2003 oxlint --type-aware --deny-warnings hooks tests
